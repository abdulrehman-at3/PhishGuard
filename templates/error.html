<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inspection Error — PhishGuard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">
            <i class="bi bi-shield-lock-fill"></i> PhishGuard
        </a>
    </div>
</nav>

<main class="container error-page">
    <section class="glass-card error-card">
        <i class="bi bi-exclamation-diamond-fill error-icon"></i>
        <h1>Something Went Wrong</h1>
        <p>{{ error_message or "An unexpected error occurred. Please try again." }}</p>
        <a href="{{ url_for('index') }}" class="btn-analyze"><i class="bi bi-house-fill"></i> Back to Home</a>
    </section>
</main>

<footer class="footer">
    <div class="container text-center">
        <p>PhishGuard — built for cybersecurity awareness education.</p>
    </div>
</footer>

</body>
</html>
